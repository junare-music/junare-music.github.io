<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Feedback</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <a href="index.html">&larr; Home</a>
  <h1>Feedback</h1>
</header>

<form id="feedback-form">
  <label>Email Address</label>
  <input type="email" id="user-email" placeholder="name@example.com" required>

  <label>Rating</label>
  <select id="user-rating" required style="padding: 10px; border-radius: 5px; margin-bottom: 15px;">
    <option value="" disabled selected>Select a rating...</option>
    <option value="5">⭐⭐⭐⭐⭐ (Excellent)</option>
    <option value="4">⭐⭐⭐⭐ (Good)</option>
    <option value="3">⭐⭐⭐ (Okay)</option>
    <option value="2">⭐⭐ (Bad)</option>
    <option value="1">⭐ (Terrible)</option>
  </select>

  <label>Message</label>
  <textarea id="user-message" rows="5" placeholder="How can we improve Juna Re?" required></textarea>

  <button type="submit">Send Feedback</button>
</form>


<script src="script.js"></script>
</body>
</html>
